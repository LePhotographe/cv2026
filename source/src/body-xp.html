<div class="crt" id="crt">
<div class="crt-unit">
<div class="crt-case">
<div class="crt-bezel">
<div class="crt-screen" id="screen">
<div class="desk" id="desk" style="background-image:url({{WALLPAPER}})">
  <div class="desk-icons" id="desk-icons" role="list" aria-label="Icônes du bureau"></div>
  <div class="desk-corner" id="desk-corner"></div>
</div>
<div class="wins" id="wins"></div>

<div class="sm" id="startmenu" role="menu" aria-label="Menu démarrer" hidden></div>
<div class="balloon" id="balloon" role="status" hidden></div>

<footer class="taskbar" id="taskbar">
  <button class="start" id="start-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="startmenu"><span id="start-ico"></span>démarrer</button>
  <div class="tasks" id="tasks" role="toolbar" aria-label="Fenêtres ouvertes"></div>
  <div class="tray">
    <button class="tray-btn" id="tray-dispo" type="button" aria-label="Ouvert aux opportunités"></button>
    <button class="tray-btn" id="tray-sound" type="button" aria-pressed="true" aria-label="Sons"></button>
    <time class="clock" id="clock"></time>
  </div>
</footer>

<div class="welcome" id="welcome">
  <div class="welcome-top"></div>
  <div class="welcome-mid">
    <div class="welcome-brand"><b>Le bureau</b><span>d’Arthur Chauvineau</span><p>Pour commencer, cliquez sur le profil</p></div>
    <div class="welcome-sep"></div>
    <button class="welcome-user" id="welcome-user" type="button"><img src="{{AVATAR}}" alt=""><span><b>Arthur Chauvineau</b><small>Expérience client · Transformation digitale</small><em id="welcome-hint">Ouvert aux opportunités</em></span></button>
  </div>
  <div class="welcome-bot"><span>Golfeur depuis 25 ans</span></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
</div>
<div class="crt-chin" aria-hidden="true"><span class="crt-badge">AC</span><span class="crt-model">Bureau 2026 · 1024 × 768</span><span class="crt-vents"></span><span class="crt-led"></span><span class="crt-power"></span></div>
</div>
<div class="crt-stand" aria-hidden="true"></div>
</div>
</div>
